name: core
description: "A new Flutter package project."
version: 0.0.1
homepage:
publish_to: 'none' # Tidak untuk publikasi

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  google_fonts: ^6.2.1
  equatable: ^2.0.7
  encrypt: ^5.0.3
  provider: ^6.1.5
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.1
  http: ^1.2.2
  lottie: ^3.3.1


  data_connection_checker:
    git:
      url: https://github.com/chornthorn/data_connection_checker.git
      ref: master

  # Registrasi Module for Modularization
  movies:
    path: ../movies
  about:
    path: ../about
  tv_series:
    path: ../tv_series


  flutter:
    sdk: flutter

dev_dependencies:
  mockito: ^5.4.6 # Data Tiruan
  mocktail_image_network: ^1.2.0
  mocktail: ^1.0.4

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your package, add an assets section, like this:
  assets:
    - assets/images/
    - assets/image_lottie/
    - certificates/
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500


