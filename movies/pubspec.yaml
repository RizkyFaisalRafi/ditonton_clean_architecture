name: movies
description: "A new Flutter package project."
publish_to: 'none'
version: 0.0.1
homepage:

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  http: ^1.2.2
  provider: ^6.1.2
  dartz: ^0.10.1
  equatable: ^2.0.5
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1
  get_it: ^7.7.0
  #  sqflite: ^2.3.3+1 # Sudah digantikan sqflite_sqlcipher lebih aman
  path_provider: ^2.1.4
  lottie: ^3.3.1
  pull_to_refresh: ^2.0.0
  freezed_annotation: ^3.0.0
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  #  rxdart: ^0.27.1 # Sudah pakai bloc_concurrency
  sqflite_sqlcipher: ^3.1.0+1
  encrypt: ^5.0.3
  firebase_core: ^3.14.0
  firebase_crashlytics: ^4.3.7
  firebase_analytics: ^11.5.0

  data_connection_checker:
    git:
      url: https://github.com/chornthorn/data_connection_checker.git
      ref: master

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Registrasi Module for Modularization
  core:
    path: ../core
  about:
    path: ../about
  tv_series:
    path: ../tv_series


dev_dependencies:
  mockito: ^5.4.6 # Data Tiruan
  build_runner: ^2.4.15 # Generator
  sqflite_common_ffi: ^2.3.5 # test sqflite Testing atau aplikasi desktop/CLI
  mocktail_image_network: ^1.2.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0
  rename_app: ^1.6.3
  freezed: ^3.0.6
  bloc_test: ^10.0.0

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


